{% extends 'base.html' %}

{% block title %}Add Farmer{% endblock %}

{% block content %}

<h1 class="mb-4">Add Farmer</h1>

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn btn-dark">
        Save Farmer
    </button>

    <a href="{% url 'farmer_list' %}" class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
