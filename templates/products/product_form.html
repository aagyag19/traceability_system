{% extends 'base.html' %}

{% block title %}
    {% if product %}Edit Product{% else %}Add Product{% endif %}
{% endblock %}

{% block content %}

<h1 class="mb-4">
    {% if product %}
        Edit Product
    {% else %}
        Add Product
    {% endif %}
</h1>

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn btn-dark">
        {% if product %}
            Update Product
        {% else %}
            Save Product
        {% endif %}
    </button>

    <a href="{% url 'product_list' %}" class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
