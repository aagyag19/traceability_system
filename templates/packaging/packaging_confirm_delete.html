{% extends 'base.html' %}

{% block title %}Delete Packaging{% endblock %}

{% block content %}

<h1>Delete Packaging Record</h1>

<p>
    Are you sure you want to delete the packaging record for
    <strong>{{ packaging.batch.batch_number }}</strong>?
</p>

<p>
    <strong>Product:</strong>
    {{ packaging.batch.product.name }}
</p>

<form method="POST">

    {% csrf_token %}

    <button type="submit" class="btn btn-danger">
        Yes, Delete
    </button>

    <a
        href="{% url 'packaging_list' %}"
        class="btn btn-secondary"
    >
        Cancel
    </a>

</form>

{% endblock %}
