{% extends 'base.html' %}

{% block title %}Add Cooperative{% endblock %}

{% block content %}

<h1 class="mb-4">Add Cooperative</h1>

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn btn-dark">
        Save Cooperative
    </button>

    <a href="{% url 'cooperative_list' %}" class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
